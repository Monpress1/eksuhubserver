name: Keep Render Server Awake (WebSocket)

on:
  push:                     # Runs on every commit push
  schedule:
    - cron: "*/5 * * * *"   # Runs every 5 minutes (UTC)
  workflow_dispatch:         # Allows manual run from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render WebSocket server
        run: |
          echo "Pinging Render WebSocket server..."
          curl --fail -A "GitHub Actions Cron Job" -s -o /dev/null -w "HTTP %{http_code}\n" https://websocket-server-6jct.onrender.com
