name: Keep Render Server Awake (WebSocket)

on:
  push:                     # Run on every commit
  schedule:
    - cron: "*/5 * * * *"   # Run every 5 minutes (UTC)
  workflow_dispatch:         # Allow manual trigger from GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Install wscat
        run: npm install -g wscat

      - name: Ping WebSocket server
        run: |
          echo "Connecting to WebSocket..."
          # Open a connection, send 'ping', then immediately close
          wscat -c wss://websocket-server-6jct.onrender.com -x 'ping'
