name: Keep Render Server Awake (WebSocket)

on:
  schedule:
    - cron: '*/5 * * * *'  # Run every 5 minutes

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render WebSocket server
        run: |
          echo "Pinging server..."
          curl --fail -A "GitHub Actions Cron Job" -s -o /dev/null -w "HTTP %{http_code}\n" https://websocket-server-6jct.onrender.com
