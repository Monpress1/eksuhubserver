name: Keep Render Server Awake

on:
  push:                  # 🔹 Run instantly on commit
  schedule:
    - cron: '*/2 * * * *'   # 🔹 runs every 2 minutes 
  workflow_dispatch:     # 🔹 Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render WebSocket server
        run: curl -s -o /dev/null -w "%{http_code}" https://websocket-server-6jct.onrender.com
